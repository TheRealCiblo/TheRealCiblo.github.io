<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vanillafy.xyz</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --orange: #FF6B00;
      --orange-light: #FF9A3C;
      --orange-glow: #FFB347;
      --discord: #5865F2;
      --discord-hover: #4752C4;
      --bg: #0a0a0a;
      --text: #fff;
    }
    * { cursor: none !important; }
    #cursor {
      width: 22px; height: 22px;
      background: var(--orange);
      border-radius: 50%;
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease, background 0.2s;
      box-shadow: 0 0 16px 4px var(--orange-glow);
    }
    #cursor-ring {
      width: 44px; height: 44px;
      border: 2px solid var(--orange-light);
      border-radius: 50%;
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.18s ease, left 0.12s ease, top 0.12s ease;
      opacity: 0.5;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Fredoka One', cursive;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow-x: hidden;
    }
    .bg-blob {
      position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: 0.18;
      animation: blobFloat 8s ease-in-out infinite;
      pointer-events: none; z-index: 0;
    }
    .blob1 { width: 500px; height: 500px; background: var(--orange); top: -100px; left: -100px; animation-delay: 0s; }
    .blob2 { width: 400px; height: 400px; background: var(--orange-light); bottom: -80px; right: -80px; animation-delay: -4s; }
    .blob3 { width: 300px; height: 300px; background: #ff3d00; top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: -2s; }
    @keyframes blobFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }
    main {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; gap: 18px;
      padding: 40px 20px; text-align: center;
    }
    .logo {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(3rem, 10vw, 7rem);
      color: var(--orange);
      text-shadow: 0 0 40px rgba(255,107,0,0.6), 0 4px 0 rgba(0,0,0,0.4);
      letter-spacing: 2px;
      animation: popIn 0.7s cubic-bezier(.34,1.56,.64,1) both;
      line-height: 1;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7) translateY(30px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .tagline {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1rem, 3vw, 1.5rem);
      color: var(--orange-light);
      letter-spacing: 3px; text-transform: uppercase;
      animation: popIn 0.7s 0.15s cubic-bezier(.34,1.56,.64,1) both;
    }
    .buttons {
      display: flex; gap: 16px; flex-wrap: wrap;
      justify-content: center; margin-top: 10px;
      animation: popIn 0.7s 0.3s cubic-bezier(.34,1.56,.64,1) both;
    }
    .btn {
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem; letter-spacing: 1px;
      padding: 14px 36px; border-radius: 50px; border: none;
      background: var(--orange); color: #fff;
      box-shadow: 0 4px 24px rgba(255,107,0,0.4);
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      position: relative; overflow: hidden;
      text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(255,255,255,0.12); opacity: 0; transition: opacity 0.2s;
    }
    .btn:hover::after { opacity: 1; }
    .btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 8px 32px rgba(255,107,0,0.6); }
    .btn:active { transform: scale(0.97); }
    .btn-discord {
      background: var(--discord); box-shadow: 0 4px 24px rgba(88,101,242,0.4); color: #fff;
    }
    .btn-discord:hover { background: var(--discord-hover); box-shadow: 0 8px 32px rgba(88,101,242,0.6); }
    .btn-discord::after { display: none; }

    .dropdown-wrapper {
      animation: popIn 0.7s 0.45s cubic-bezier(.34,1.56,.64,1) both;
      display: flex; flex-direction: column; align-items: center;
    }
    .toggle-btn {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      color: var(--orange-light);
      background: rgba(255,107,0,0.08);
      border: 2px solid rgba(255,107,0,0.3);
      border-radius: 50px; padding: 12px 28px;
      transition: background 0.2s, border-color 0.2s;
    }
    .toggle-btn:hover { background: rgba(255,107,0,0.18); border-color: var(--orange); }
    .arrow { display: inline-block; transition: transform 0.3s cubic-bezier(.34,1.56,.64,1); font-size: 1rem; }
    .arrow.open { transform: rotate(180deg); }

    .dropdown-box {
      max-height: 0; overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.3s ease;
      opacity: 0; width: 340px; max-width: 92vw;
    }
    .dropdown-box.open { max-height: 420px; opacity: 1; }

    .dropdown-inner {
      margin-top: 12px;
      background: rgba(15,15,15,0.95);
      border: 2px solid rgba(255,107,0,0.3);
      border-radius: 16px; padding: 0;
      overflow: hidden;
    }
    .dropdown-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255,107,0,0.15);
    }
    .dropdown-header-left {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Fredoka One', cursive; font-size: 1rem;
    }
    .server-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #4ade80; box-shadow: 0 0 8px #4ade80;
      flex-shrink: 0;
    }
    .server-dot.offline { background: #f87171; box-shadow: 0 0 8px #f87171; }
    .player-count-badge {
      font-size: 0.8rem; padding: 2px 10px;
      border-radius: 20px; background: rgba(255,107,0,0.15);
      color: var(--orange-light); font-family: 'Fredoka One', cursive;
    }
    .refresh-btn {
      background: none; border: none; color: rgba(255,255,255,0.35);
      font-size: 1.1rem; padding: 4px; border-radius: 6px;
      transition: color 0.2s; font-family: 'Fredoka One', cursive;
    }
    .refresh-btn:hover { color: var(--orange-light); }

    .player-list {
      max-height: 300px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: rgba(255,107,0,0.3) transparent;
    }
    .player-list::-webkit-scrollbar { width: 4px; }
    .player-list::-webkit-scrollbar-track { background: transparent; }
    .player-list::-webkit-scrollbar-thumb { background: rgba(255,107,0,0.3); border-radius: 4px; }

    .player-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.15s;
    }
    .player-item:last-child { border-bottom: none; }
    .player-item:hover { background: rgba(255,107,0,0.06); }
    .player-avatar {
      width: 36px; height: 36px; border-radius: 6px;
      background: rgba(255,107,0,0.1); flex-shrink: 0;
      overflow: hidden; position: relative;
      border: 1px solid rgba(255,107,0,0.2);
    }
    .player-avatar img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
    .player-avatar .avatar-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .player-info { flex: 1; min-width: 0; text-align: left; }
    .player-name {
      font-family: 'Fredoka One', cursive;
      font-size: 0.95rem; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .player-status {
      font-size: 0.72rem; color: #4ade80; font-family: 'Fredoka One', cursive;
      display: flex; align-items: center; gap: 4px;
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #4ade80; flex-shrink: 0;
    }
    .empty-state {
      padding: 28px 18px; text-align: center;
      color: rgba(255,255,255,0.4); font-size: 0.9rem; font-family: 'Fredoka One', cursive;
    }
    .empty-state .big-icon { font-size: 2rem; margin-bottom: 8px; display: block; }
    .loading-state {
      padding: 28px 18px; text-align: center;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      color: rgba(255,255,255,0.4); font-size: 0.9rem; font-family: 'Fredoka One', cursive;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,107,0,0.2);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .ip-wrapper {
      animation: popIn 0.7s 0.6s cubic-bezier(.34,1.56,.64,1) both;
      display: flex; flex-direction: column; align-items: center;
    }
    .ip-toggle {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Fredoka One', cursive; font-size: 1.1rem;
      color: var(--orange-light);
      background: rgba(255,107,0,0.08);
      border: 2px solid rgba(255,107,0,0.3);
      border-radius: 50px; padding: 12px 28px;
      transition: background 0.2s, border-color 0.2s;
    }
    .ip-toggle:hover { background: rgba(255,107,0,0.18); border-color: var(--orange); }
    .ip-box { max-height: 0; overflow: hidden; transition: max-height 0.4s ease, opacity 0.3s ease; opacity: 0; }
    .ip-box.open { max-height: 200px; opacity: 1; }
    .ip-inner {
      margin-top: 12px; background: rgba(255,107,0,0.08);
      border: 2px solid rgba(255,107,0,0.3); border-radius: 16px;
      padding: 18px 28px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .ip-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.4); font-family: 'Fredoka One', cursive; }
    .ip-address {
      font-family: 'Fredoka One', cursive; font-size: 1.5rem;
      color: var(--orange); text-shadow: 0 0 20px rgba(255,107,0,0.5);
    }
    .copy-btn {
      font-family: 'Fredoka One', cursive; font-size: 0.85rem;
      padding: 6px 18px; border-radius: 20px; border: none;
      background: rgba(255,107,0,0.2); color: var(--orange-light);
      transition: background 0.2s; margin-top: 2px;
    }
    .copy-btn:hover { background: rgba(255,107,0,0.35); }
  </style>
</head>
<body>

<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>
<div class="bg-blob blob3"></div>
<div id="cursor"></div>
<div id="cursor-ring"></div>

<main>
  <div class="logo">Vanillafy.xyz</div>
  <div class="tagline">Vanilla Minecraft at its Finest</div>

  <div class="buttons">
    <button class="btn" onclick="alert('Store coming soon!')">🛒 Store</button>
    <a class="btn btn-discord" href="https://discord.gg/nWHqWDwr77" target="_blank" rel="noopener">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.032.056a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      Discord
    </a>
  </div>

  <div class="dropdown-wrapper">
    <button class="toggle-btn" onclick="togglePlayers()" id="playersToggle">
      👥 Players <span class="arrow" id="playersArrow">▼</span>
    </button>
    <div class="dropdown-box" id="playersBox">
      <div class="dropdown-inner">
        <div class="dropdown-header">
          <div class="dropdown-header-left">
            <div class="server-dot" id="serverDot"></div>
            <span id="serverStatusText" style="color:rgba(255,255,255,0.7);font-size:0.9rem;font-family:'Fredoka One',cursive;">Checking...</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="player-count-badge" id="playerCountBadge">— / —</span>
            <button class="refresh-btn" onclick="fetchPlayers()" title="Refresh">↻</button>
          </div>
        </div>
        <div id="playerListContainer">
          <div class="loading-state">
            <div class="spinner"></div>
            Fetching player data…
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="ip-wrapper">
    <button class="ip-toggle" onclick="toggleIP()" id="ipToggle">
      🌐 Server IP <span class="arrow" id="arrow">▼</span>
    </button>
    <div class="ip-box" id="ipBox">
      <div class="ip-inner">
        <div class="ip-label">Join us at</div>
        <div class="ip-address">play.vanillafy.xyz:26225</div>
        <button class="copy-btn" onclick="copyIP()">📋 Copy IP</button>
      </div>
    </div>
  </div>
</main>

<script>
  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursor-ring');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
    setTimeout(() => {
      ring.style.left = e.clientX + 'px';
      ring.style.top = e.clientY + 'px';
    }, 60);
  });

  let playersFetched = false;

  function togglePlayers() {
    const box = document.getElementById('playersBox');
    const arrow = document.getElementById('playersArrow');
    box.classList.toggle('open');
    arrow.classList.toggle('open');
    if (box.classList.contains('open') && !playersFetched) {
      fetchPlayers();
    }
  }

  async function fetchPlayers() {
    playersFetched = true;
    const container = document.getElementById('playerListContainer');
    const dot = document.getElementById('serverDot');
    const statusText = document.getElementById('serverStatusText');
    const badge = document.getElementById('playerCountBadge');

    container.innerHTML = '<div class="loading-state"><div class="spinner"></div>Fetching player data…</div>';

    try {
      const res = await fetch('https://api.mcsrvstat.us/3/play.vanillafy.xyz:26225');
      const data = await res.json();

      if (!data.online) {
        dot.classList.add('offline');
        statusText.textContent = 'Server offline';
        badge.textContent = '0 / 0';
        container.innerHTML = '<div class="empty-state"><span class="big-icon">🔴</span>Server is currently offline</div>';
        return;
      }

      dot.classList.remove('offline');
      const online = data.players?.online ?? 0;
      const max = data.players?.max ?? 0;
      statusText.textContent = 'Server online';
      badge.textContent = online + ' / ' + max;

      const players = data.players?.list ?? [];

      if (players.length === 0) {
        container.innerHTML = '<div class="empty-state"><span class="big-icon">🌿</span>No players online right now<br><span style="font-size:0.8rem;margin-top:4px;display:block;color:rgba(255,255,255,0.25)">Be the first to join!</span></div>';
        return;
      }

      let html = '<div class="player-list">';
      for (const player of players) {
        const name = typeof player === 'string' ? player : (player.name || 'Unknown');
        const uuid = typeof player === 'object' && player.uuid ? player.uuid : null;
        const skinUrl = uuid
          ? `https://crafatar.com/avatars/${uuid}?size=36&overlay&default=MHF_Steve`
          : `https://crafatar.com/avatars/${encodeURIComponent(name)}?size=36&overlay&default=MHF_Steve`;

        html += `
          <div class="player-item">
            <div class="player-avatar">
              <img src="${skinUrl}" alt="${escapeHtml(name)}'s avatar" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
              <div class="avatar-placeholder" style="display:none;">🎮</div>
            </div>
            <div class="player-info">
              <div class="player-name">${escapeHtml(name)}</div>
              <div class="player-status"><span class="status-dot"></span>Online</div>
            </div>
          </div>`;
      }
      html += '</div>';
      container.innerHTML = html;

    } catch (e) {
      dot.classList.add('offline');
      statusText.textContent = 'Could not reach server';
      badge.textContent = '—';
      container.innerHTML = '<div class="empty-state"><span class="big-icon">⚠️</span>Could not fetch server data<br><span style="font-size:0.8rem;margin-top:4px;display:block;color:rgba(255,255,255,0.25)">Check your connection and try again</span></div>';
    }
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function toggleIP() {
    const box = document.getElementById('ipBox');
    const arrow = document.getElementById('arrow');
    box.classList.toggle('open');
    arrow.classList.toggle('open');
  }

  function copyIP() {
    navigator.clipboard.writeText('play.vanillafy.xyz:26225');
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✅ Copied!';
    setTimeout(() => btn.textContent = '📋 Copy IP', 2000);
  }
</script>
</body>
</html>
