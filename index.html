<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Poppins", sans-serif;
    color: #fff;
  }
  .window {
    box-sizing: border-box;
    width: 500px;
    height: 500px;
    background: #1e1e1e;
    padding: 56px 64px;
  }
  .date {
    display: inline-block;
    background: #333;
    padding: 14px 18px;
    font-size: 14px;
    font-weight: 600;
  }
  h1 {
    margin: 40px 0 0;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
</style>
</head>
<body>
  <div class="window">
    <span class="date">5 November 2026</span>
    <h1>Welcome to ciblo.xyz</h1>
  </div>
</body>
</html>
