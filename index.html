<style>
  :root{

    --surface:#131313;
    --line:#2A2A2A;

    --accent:#FFFFFF;

  *{

    font-family:'Sora', sans-serif !important;
    font-weight:700 !important;
  }
  button, a, input, video{ cursor:none !important; }
  body{
    cursor:none;
    background:linear-gradient(to bottom, #2E2E2E 0%, #0A0A0A 55%, #000000 100%);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    gap:32px;
    padding:60px 24px;
  }
  a{ color:inherit; text-decoration:none; }

  .logo{
    font-size:clamp(48px, 9vw, 96px);
    letter-spacing:-0.04em;
    min-height:1.2em;
    display:flex; align-items:center; justify-content:center;
  }
  .logo-cursor{
    display:inline-block;
    margin-left:2px;
    animation:blink 0.9s step-end infinite;
  }
  @keyframes blink{
    0%, 100%{ opacity:1; }
    50%{ opacity:0; }
  }

  .crosshair{
    position:fixed; top:0; left:0;
    transform:translate(-50%, -50%);
    width:22px; height:22px;
    pointer-events:none; z-index:2147483647;
    opacity:0.85;
    will-change:transform, left, top;
  }
  .crosshair svg{ width:100%; height:100%; display:block; }
  .crosshair-smear{
    position:fixed; transform:translate(-50%, -50%);
    width:22px; height:22px;
    pointer-events:none; z-index:2147483646;
    opacity:0;
    will-change:transform, opacity;
  }
  .crosshair-smear svg{ width:100%; height:100%; display:block; }
  .site-gate{
    position:fixed; inset:0; z-index:2147483645;
    display:grid; place-items:center;
    background:rgba(0,0,0,.28); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:opacity .45s ease, visibility .45s ease;
  }
  .site-gate.is-open{ opacity:0; visibility:hidden; pointer-events:none; }
  .site-gate-btn{
    padding:18px 34px; border:1px solid rgba(255,255,255,.7); border-radius:3px;
    background:rgba(10,10,10,.88); color:var(--text); font-size:18px;
    cursor:pointer; box-shadow:0 0 26px rgba(255,255,255,.16);
    transition:transform .16s ease, background .16s ease;
  }
  .site-gate-btn:hover{ transform:scale(1.05); background:#222; }

  /* ---------- SNOW ---------- */
  .snow{
    position:fixed; inset:0;
    pointer-events:none; overflow:hidden; z-index:3;
  }
  .snowflake{
    position:absolute; top:-10px;
    background:#ffffff; border-radius:50%;
    opacity:0.85;
    animation-name:fall, sway;
    animation-timing-function:linear, ease-in-out;
    animation-iteration-count:infinite, infinite;
  }
  @keyframes fall{
    0%{ transform:translateY(-10px); }
    100%{ transform:translateY(110vh); }
  }
  @keyframes sway{
    0%, 100%{ margin-left:0; }
    50%{ margin-left:20px; }
  }

  .payment-btn{
    background:#635BFF; color:#FFFFFF;
    font-size:16px; padding:18px 40px; border-radius:2px;
    border:none; cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .payment-btn:hover{ background:#4F46E5; transform:translateY(-2px); box-shadow:0 0 18px rgba(99,91,255,0.5); }
  .music-player{
    position:fixed; top:20px; left:20px; z-index:20;
    width:188px; padding:10px 12px;
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 5px 12px rgba(0,0,0,.35);
  }
  .music-info{ display:none; }
  .music-bar{ display:flex; align-items:center; gap:8px; }
  .music-mute{
    border:0; color:#FFFFFF; background:transparent; cursor:pointer;
    transition:transform .15s ease, opacity .15s ease;
  }
  .music-mute:hover{ transform:scale(1.1); opacity:.8; }
  .music-mute{ width:38px; height:38px; display:grid; place-items:center; font-size:0; flex:0 0 auto; }
  .music-mute::before{
    content:''; width:0; height:0; margin-left:4px;
    border-top:11px solid transparent; border-bottom:11px solid transparent;
    border-left:17px solid #FFFFFF;
  }
  .music-mute.is-playing::before{
    width:16px; height:21px; margin-left:0; border:0;
    background:linear-gradient(90deg, #FFFFFF 0 38%, transparent 38% 62%, #FFFFFF 62% 100%);
  }
  .music-volume{ appearance:none; -webkit-appearance:none; width:100%; height:10px; border-radius:20px; background:rgba(255,255,255,.8); outline:none; cursor:pointer; }

  .music-volume::-moz-range-thumb{ width:16px; height:16px; border:0; border-radius:50%; background:#FFFFFF; box-shadow:0 1px 3px rgba(0,0,0,.25); }

    display:inline-flex; align-items:center; gap:8px;

  .social-btn:hover{ border-color:var(--text-dim); color:var(--text-dim); box-shadow:0 0 14px rgba(255,255,255,0.2); }
  .social-btn svg{ width:16px; height:16px; fill:currentColor; }

  .site-copyright{

    font-size:10px; letter-spacing:.08em; text-transform:uppercase;

  }

  @media (max-width:480px){
    .music-player{ top:14px; left:14px; }
  }

<script>
  // ---------- CROSSHAIR & CURSOR SCRIPT ----------
  const crosshair = document.querySelector('.crosshair');
  const smearCount = 7;
  const smears = Array.from({ length: smearCount }, () => {
    const smear = crosshair.cloneNode(true);
    smear.classList.remove('crosshair');
    smear.classList.add('crosshair-smear');
    smear.setAttribute('aria-hidden', 'true');
    document.body.appendChild(smear);
    return { element: smear, x: 0, y: 0, active: false };
  });
  let smearIndex = 0;
  let lastX = 0, lastY = 0, lastFrame = 0;
  let leftMouseDown = false;

  document.addEventListener('mousedown', (e) => { if (e.button === 0) leftMouseDown = true; });
  document.addEventListener('mouseup', (e) => { if (e.button === 0) leftMouseDown = false; });
  document.addEventListener('blur', () => { leftMouseDown = false; });

  document.addEventListener('mousemove', (e) => {
    const now = performance.now();
    const distance = Math.hypot(e.clientX - lastX, e.clientY - lastY);
    crosshair.style.left = e.clientX + 'px';
    crosshair.style.top = e.clientY + 'px';

    if (leftMouseDown && distance > 3 && now - lastFrame > 14) {
      const smear = smears[smearIndex];
      smearIndex = (smearIndex + 1) % smearCount;
      smear.element.style.left = e.clientX + 'px';
      smear.element.style.top = e.clientY + 'px';
      smear.element.style.opacity = '0.52';
      smear.element.style.transition = 'none';
      smear.element.style.transform = 'translate(-50%, -50%) scale(1)';
      requestAnimationFrame(() => {
        smear.element.style.transition = 'opacity 150ms ease-out, transform 150ms ease-out';
        smear.element.style.opacity = '0';
        smear.element.style.transform = 'translate(-50%, -50%) scale(0.82)';
      });
      lastFrame = now;
    }
    lastX = e.clientX;
    lastY = e.clientY;
  });

  // ---------- SNOW EFFECT ----------
  const snowContainer = document.getElementById('snow');
  const flakeCount = 60;
  for(let i = 0; i < flakeCount; i++){
    const flake = document.createElement('div');
    flake.className = 'snowflake';
    const size = Math.random() * 3 + 2;
    flake.style.width = size + 'px';
    flake.style.height = size + 'px';
    flake.style.left = Math.random() * 100 + 'vw';
    const fallDuration = Math.random() * 8 + 6;
    const swayDuration = Math.random() * 3 + 2;
    flake.style.animationDuration = fallDuration + 's, ' + swayDuration + 's';
    flake.style.animationDelay = (Math.random() * fallDuration) + 's, 0s';
    flake.style.opacity = Math.random() * 0.5 + 0.4;
    snowContainer.appendChild(flake);
  }

  // ---------- LOGO TYPING EFFECT ----------
  const logoText = document.getElementById('logoText');
  const fullLogo = 'ciblo.xyz';
  let logoIdx = 0;
  let logoDeleting = false;

  function typeLogo(){
    if(!logoDeleting){
      logoIdx++;
      logoText.textContent = fullLogo.slice(0, logoIdx);
      if(logoIdx === fullLogo.length){
        logoDeleting = true;
        setTimeout(typeLogo, 1400);
        return;
      }
      setTimeout(typeLogo, 150);
    } else {
      logoIdx--;
      logoText.textContent = fullLogo.slice(0, logoIdx);
      if(logoIdx === 0){
        logoDeleting = false;
        setTimeout(typeLogo, 500);
        return;
      }
      setTimeout(typeLogo, 90);
    }
  }
  typeLogo();

  // ---------- SUPABASE CONFIG ----------
  // Fill these in with your own project's values (Project Settings > API).
  // The anon key is meant to be public — it can only do what your Row Level
  // Security policies allow. The actual admin username/password are never
  // stored here; they live in Supabase's own Auth system and are only
  // ever typed into the login form below, never written into this file.
  const SUPABASE_URL = 'https://acyqynumllpxwrigwztr.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_PImxnsEtucJMkfTpssE6sw_0NtiBaw4';
  const sb = (SUPABASE_URL !== 'YOUR_SUPABASE_URL' && window.supabase)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  // ---------- ALTS: stock list + Mojang/Minecraft skin render ----------
  // Skin renders are pulled from mc-heads.net, a Mojang-API-backed skin
  // rendering service — it resolves a username to that account's current
  // skin and renders a head/body image, without needing a server-side call.
  // Accounts that don't actually exist on Mojang's records fall back to the
  // default Steve skin, which is what the random-pool entries render as.

  // Underlying pool of alt usernames used only to pick a skin preview for
  // the single "Random Alt" listing — these are never listed individually.
  const RANDOM_POOL_NAMES = Array.from({ length: 30 }, (_, i) => `randomalt${i + 1}`);

  // Local fallback data, used until Supabase is configured above, or if a
  // fetch fails. Once Supabase is wired up, `sold_out` and `stripe_link`
  // are driven from the database and can be changed from the admin panel
  // without editing this file.
  let ALT_STOCK = [
    { id: 'gabot', name: 'gabot', price: '25.99', rank: 'RARE', sold_out: false, stripe_link: '#' },
    { id: 'random_pool', name: 'Random Alt', price: '6.99', rank: null, sold_out: false, stripe_link: '#', isPool: true }
  ];

  const altsPurchaseBtn = document.getElementById('altsPurchaseBtn');
  const altChooser = document.getElementById('altChooser');
  const altList = document.getElementById('altList');
  const altPreview = document.getElementById('altPreview');
  const altSkinImg = document.getElementById('altSkinImg');
  const altPreviewName = document.getElementById('altPreviewName');
  const altPreviewPrice = document.getElementById('altPreviewPrice');
  const altBuyBtn = document.getElementById('altBuyBtn');
  const altBackBtn = document.getElementById('altBackBtn');

  function revealPanel(panel) {
    panel.hidden = false;
    panel.classList.remove('is-visible');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => panel.classList.add('is-visible'));
    });
  }
  function hidePanel(panel) {
    panel.classList.remove('is-visible');
    panel.hidden = true;
  }

  async function loadAltStock() {
    if (!sb) { renderAltList(); return; }
    const { data, error } = await sb.from('alts').select('*').order('sort_order', { ascending: true });
    if (!error && data && data.length) {
      ALT_STOCK = data.map((row) => ({
        id: row.id,
        name: row.display_name,
        price: Number(row.price).toFixed(2),
        rank: row.rank,
        sold_out: row.sold_out,
        stripe_link: row.stripe_link || '#',
        isPool: row.slug === 'random_pool'
      }));
    }
    renderAltList();
  }

  function renderAltList() {
    altList.innerHTML = '';
    ALT_STOCK.forEach((alt) => {
      const previewSkinName = alt.isPool
        ? RANDOM_POOL_NAMES[Math.floor(Math.random() * RANDOM_POOL_NAMES.length)]
        : alt.name;
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'alt-item' + (alt.rank ? ' is-rare' : '') + (alt.sold_out ? ' is-sold-out' : '');
      item.disabled = alt.sold_out;
      item.innerHTML = `
        <img class="alt-item-avatar" src="https://mc-heads.net/avatar/${previewSkinName}/64" alt="${alt.name} skin">
        <span class="alt-item-label">${alt.name}${alt.rank ? `<span class="alt-item-rank">${alt.rank}</span>` : ''}</span>
        <span class="alt-item-price">${alt.sold_out ? 'Sold out' : '$' + alt.price}</span>
      `;
      if (!alt.sold_out) {
        item.addEventListener('click', () => {
          altPreviewName.innerHTML = `${alt.name}${alt.rank ? `<span class="alt-item-rank">${alt.rank}</span>` : ''}`;
          altPreviewPrice.textContent = `$${alt.price}`;
          altBuyBtn.textContent = `Buy this alt — $${alt.price}`;
          altBuyBtn.href = alt.stripe_link;
          altSkinImg.src = `https://mc-heads.net/body/${previewSkinName}/160`;
          altSkinImg.alt = `${alt.name} Minecraft skin`;
          hidePanel(altChooser);
          revealPanel(altPreview);
        });
      }
      altList.appendChild(item);
    });
  }

  loadAltStock();

  altsPurchaseBtn.addEventListener('click', () => {
    altsPurchaseBtn.hidden = true;
    revealPanel(altChooser);
  });

  altBackBtn.addEventListener('click', () => {
    hidePanel(altPreview);
    revealPanel(altChooser);
  });

  // ---------- ADMIN LOGIN + STOCK PANEL ----------
  const adminTrigger = document.getElementById('adminTrigger');
  const adminOverlay = document.getElementById('adminOverlay');
  const adminClose = document.getElementById('adminClose');
  const adminLoginForm = document.getElementById('adminLoginForm');
  const adminPanel = document.getElementById('adminPanel');
  const adminEmail = document.getElementById('adminEmail');
  const adminPassword = document.getElementById('adminPassword');
  const adminLoginBtn = document.getElementById('adminLoginBtn');
  const adminError = document.getElementById('adminError');
  const adminRows = document.getElementById('adminRows');
  const adminLogoutBtn = document.getElementById('adminLogoutBtn');

  adminTrigger.addEventListener('click', () => adminOverlay.classList.add('show'));
  adminClose.addEventListener('click', () => adminOverlay.classList.remove('show'));
  adminOverlay.addEventListener('click', (e) => {
    if (e.target === adminOverlay) adminOverlay.classList.remove('show');
  });

  async function renderAdminPanel() {
    if (!sb) return;
    const { data, error } = await sb.from('alts').select('*').order('sort_order', { ascending: true });
    if (error || !data) return;
    adminRows.innerHTML = '';
    data.forEach((row) => {
      const label = document.createElement('label');
      label.className = 'admin-row';
      label.innerHTML = `
        <span>${row.display_name}</span>
        <input type="checkbox" ${row.sold_out ? 'checked' : ''}>
      `;
      label.querySelector('input').addEventListener('change', async (e) => {
        await sb.from('alts').update({ sold_out: e.target.checked }).eq('id', row.id);
        loadAltStock();
      });
      adminRows.appendChild(label);
    });
  }

  adminLoginBtn.addEventListener('click', async () => {
    adminError.textContent = '';
    if (!sb) {
      adminError.textContent = 'Supabase isn\'t configured yet — add your project URL and anon key in the script.';
      return;
    }
    const { error } = await sb.auth.signInWithPassword({
      email: adminEmail.value.trim(),
      password: adminPassword.value
    });
    if (error) {
      adminError.textContent = error.message;
      return;
    }
    adminLoginForm.hidden = true;
    adminPanel.hidden = false;
    renderAdminPanel();
  });

  adminLogoutBtn.addEventListener('click', async () => {
    if (sb) await sb.auth.signOut();
    adminPanel.hidden = true;
    adminLoginForm.hidden = false;
    adminEmail.value = '';
    adminPassword.value = '';
  });

  // Stay logged in across refreshes if there's already a valid session.
  if (sb) {
    sb.auth.getSession().then(({ data }) => {
      if (data.session) {
        adminLoginForm.hidden = true;
        adminPanel.hidden = false;
        renderAdminPanel();
      }
    });
  }

  // ---------- MUSIC PLAYER ----------
  const musicAudio = document.getElementById('musicAudio');
  const musicTrack = document.getElementById('musicTrack');
  const muteToggle = document.getElementById('muteToggle');
  const volumeSlider = document.getElementById('volumeSlider');
  const playlist = [
    { title: 'The Race — Tay-K', src: 'SpotiDown.App%20-%20The%20Race%20-%20Tay-K.mp3' },
    { title: 'LV Sandals — EsDeeKid', src: 'SpotiDown.App%20-%20LV%20Sandals%20-%20EsDeeKid.mp3' },
    { title: 'highschool prom — roombound', src: 'SpotiDown.App%20-%20highschool%20prom%20-%20roombound.mp3' },
    { title: 'An Italian Magician Be Like — Project Dumb', src: 'SpotiDown.App%20-%20An%20Italian%20Magician%20Be%20Like%20-%20Project%20Dumb.mp3' }
  ];
  let trackIndex = 0;
  let unplayedTracks = [];
  let resumeMusicAfterVideo = false;
  let fadeTimer;

  function shuffleTracks() {
    unplayedTracks = playlist.map((_, index) => index);
    for (let i = unplayedTracks.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [unplayedTracks[i], unplayedTracks[j]] = [unplayedTracks[j], unplayedTracks[i]];
    }
  }
  function playNextShuffledTrack() {
    if (!unplayedTracks.length) shuffleTracks();
    loadTrack(unplayedTracks.pop());
  }

  function loadTrack(index) {
    trackIndex = (index + playlist.length) % playlist.length;
    musicAudio.src = playlist[trackIndex].src;
    musicTrack.textContent = playlist[trackIndex].title;
    muteToggle.title = `Now playing: ${playlist[trackIndex].title}`;
  }
  function playMusic() {
    musicAudio.play();
  }
  function fadeInMusic() {
    clearInterval(fadeTimer);
    const targetVolume = Number(volumeSlider.value);
    musicAudio.volume = 0;
    playMusic();
    const steps = 20;
    let step = 0;
    fadeTimer = setInterval(() => {
      step++;
      musicAudio.volume = Math.min(targetVolume, targetVolume * (step / steps));
      if (step >= steps) clearInterval(fadeTimer);
    }, 40);
  }
  function pauseMusicForVideo() {
    clearInterval(fadeTimer);
    if (!musicAudio.paused) {
      resumeMusicAfterVideo = true;
      musicAudio.pause();
    }
  }
  function resumeMusicWhenVideosPause() {
    window.setTimeout(() => {
      const videoIsStillPlaying = [...document.querySelectorAll('.video-frame video')]
        .some((workVideo) => !workVideo.paused && !workVideo.ended);
      if (!videoIsStillPlaying && resumeMusicAfterVideo) {
        resumeMusicAfterVideo = false;
        fadeInMusic();
      }
    }, 150);
  }

  playNextShuffledTrack();
  musicAudio.volume = Number(volumeSlider.value);
  document.getElementById('siteGateBtn').addEventListener('click', () => {
    document.getElementById('siteGate').classList.add('is-open');
    playMusic();
  });
  muteToggle.addEventListener('click', () => {
    if (musicAudio.paused) playMusic();
    else musicAudio.pause();
  });
  volumeSlider.addEventListener('input', () => {
    musicAudio.volume = Number(volumeSlider.value);
  });
  musicAudio.addEventListener('play', () => {
    muteToggle.classList.add('is-playing');
    muteToggle.setAttribute('aria-label', 'Pause music');
  });
  musicAudio.addEventListener('pause', () => {
    muteToggle.classList.remove('is-playing');
    muteToggle.setAttribute('aria-label', 'Play music');
  });
  musicAudio.addEventListener('ended', () => {
    playNextShuffledTrack();
    playMusic();
  });
