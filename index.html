/* Layout: one terminal window on a near-black desktop; centered server card inside, flat surfaces, one accent (Discord purple) */
:root{
  --desk:#121214;
  --chrome:#1b1b1d;
  --tab:#262628;
  --tab-fg:#ececec;
  --muted:#8c8c93;
  --screen:#2b2b2e;
  --line:#3d3d42;
  --slot:#3a3a3f;
  --slot-hover:#46464c;
  --ink:#ffffff;
  --purple:#2c2370;
  --purple-hi:#382d8c;
  --purple-line:#4b3fb5;
  --discord:#7b86ff;
  --ok:#8fe39a;
  --font:"Minecraft Ten","Courier New",monospace;
  --ui:"Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font);padding-inline:16px;padding-block:24px;display:flex}
.win{margin:auto;width:100%;max-width:1040px;min-height:min(620px,100%);display:flex;flex-direction:column;background:var(--screen);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.55)}
.bar{display:flex;align-items:flex-end;justify-content:space-between;background:var(--chrome);padding:8px 0 0 8px;font-family:var(--ui)}
.tabs{display:flex;align-items:center;min-width:0}
.tab{display:flex;align-items:center;gap:10px;min-width:0;background:var(--screen);color:var(--tab-fg);font-size:12.5px;padding:9px 12px;border-radius:8px 8px 0 0}
.tab .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd{flex:none;width:16px;height:13px;border:1px solid #b5b5b9;border-radius:2px;font:700 6.5px/11px "Consolas","Courier New",monospace;color:#cfcfd3;text-align:center}
.x,.plus{flex:none;color:#a9a9b0;line-height:1;text-align:center}
.x{font-size:11px;width:20px}
.plus{margin-left:10px;font-size:18px;width:22px}
.ctl{display:flex;align-self:flex-start;margin-top:-8px}
.ctl i{width:46px;height:34px;display:grid;place-items:center;color:#c9c9ce;font-style:normal;font-size:11px}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(40px,8vw,72px);padding:clamp(48px,9vw,88px) 16px;background:var(--screen)}
h1{margin:0;font-weight:400;font-size:clamp(34px,9vw,88px);letter-spacing:.03em;line-height:1;color:var(--ink);text-shadow:.06em .06em 0 #000;text-align:center;animation:in .6s ease both}
.stack{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;animation:in .6s ease .12s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ip,.dc{position:relative;overflow:hidden;transition:background .18s ease,border-color .18s ease,transform .18s ease}
.ip::before,.dc::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:skewX(-18deg);pointer-events:none}
.ip:hover::before,.ip:focus-visible::before,.dc:hover::before,.dc:focus-visible::before{animation:shine .8s ease}
@keyframes shine{to{left:140%}}
.ip{width:100%;max-width:497px;min-height:64px;display:flex;align-items:center;gap:16px;padding:8px 16px 8px 20px;background:var(--slot);color:var(--ink);border:1px solid var(--line);border-radius:4px;font:inherit;font-size:clamp(17px,4.4vw,30px);cursor:pointer;text-align:left}
.ip:hover{background:var(--slot-hover);border-color:#58585f}
.ip:active,.dc:active{transform:scale(.985)}
.ip:focus-visible,.dc:focus-visible{outline:2px solid #fff;outline-offset:3px}
.ip .tag{flex:none;color:var(--muted)}
.ip .addr{flex:1;min-width:0;overflow-wrap:anywhere;user-select:all}
.ip svg{flex:none;width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:square;transition:stroke .18s}
.ip:hover svg{stroke:#fff}
.ip .ck{display:none}
.ip.done .cp{display:none}.ip.done .ck{display:block;stroke:var(--ok)}
.dc{width:96px;height:96px;display:grid;place-items:center;background:var(--purple);border:1px solid var(--purple-line);border-radius:4px;text-decoration:none}
.dc:hover{background:var(--purple-hi);border-color:#6a5df0}
.dc svg{width:54px;height:54px;fill:var(--discord)}
.hint{min-height:1.2em;font-size:15px;color:var(--muted);text-align:center}
.hint.ok{color:var(--ok)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
