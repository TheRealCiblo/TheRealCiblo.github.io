<style>
  :root{
    --bg:#0A0A0A;
    --surface:#131313;
    --line:#2A2A2A;
    --text:#F5F5F5;
    --text-dim:#8F8F8F;
    --accent:#FFFFFF;
  }
  *{ 
    margin:0; padding:0; box-sizing:border-box; cursor:none; 
    font-family:'Sora', sans-serif !important;
    font-weight:700 !important;
  }
  body{
    cursor:none;
    background:linear-gradient(to bottom, #2E2E2E 0%, #0A0A0A 55%, #000000 100%);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    gap:32px;
    padding:60px 24px;
  }
  a{ color:inherit; text-decoration:none; }

  .logo{
    font-size:clamp(48px, 9vw, 96px);
    letter-spacing:-0.04em;
    min-height:1.2em;
    display:flex; align-items:center; justify-content:center;
  }
  .logo-cursor{
    display:inline-block;
    margin-left:2px;
    animation:blink 0.9s step-end infinite;
  }
  @keyframes blink{
    0%, 100%{ opacity:1; }
    50%{ opacity:0; }
  }

  .crosshair{
    position:fixed; top:0; left:0;
    transform:translate(-50%, -50%);
    width:22px; height:22px;
    pointer-events:none; z-index:9999;
    opacity:0.85;
    will-change:transform, left, top;
  }
  .crosshair svg{ width:100%; height:100%; display:block; }
  .crosshair-smear{
    position:fixed; transform:translate(-50%, -50%);
    width:22px; height:22px;
    pointer-events:none; z-index:9998;
    opacity:0;
    will-change:transform, opacity;
  }
  .crosshair-smear svg{ width:100%; height:100%; display:block; }

  /* ---------- SNOW ---------- */
  .snow{
    position:fixed; inset:0;
    pointer-events:none; overflow:hidden; z-index:3;
  }
  .snowflake{
    position:absolute; top:-10px;
    background:#ffffff; border-radius:50%;
    opacity:0.85;
    animation-name:fall, sway;
    animation-timing-function:linear, ease-in-out;
    animation-iteration-count:infinite, infinite;
  }
  @keyframes fall{
    0%{ transform:translateY(-10px); }
    100%{ transform:translateY(110vh); }
  }
  @keyframes sway{
    0%, 100%{ margin-left:0; }
    50%{ margin-left:20px; }
  }

  .hire-btn{
    background:var(--accent); color:#0A0A0A;
    font-size:16px; padding:18px 40px; border-radius:2px;
    border:none; cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .hire-btn:hover{ background:#D8D8D8; transform:translateY(-2px); box-shadow:0 0 18px rgba(255,255,255,0.35); }
  .payment-btn{
    background:#635BFF; color:#FFFFFF;
    font-size:16px; padding:18px 40px; border-radius:2px;
    border:none; cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .payment-btn:hover{ background:#4F46E5; transform:translateY(-2px); box-shadow:0 0 18px rgba(99,91,255,0.5); }

  .social-row{ display:flex; gap:14px; }
  .social-btn{
    border:1px solid var(--line); color:var(--text);
    font-size:14px; padding:12px 22px; border-radius:2px;
    transition:border-color .15s ease, color .15s ease, box-shadow .15s ease;
    display:inline-flex; align-items:center; gap:8px;
  }
  .social-btn:hover{ border-color:var(--text-dim); color:var(--text-dim); box-shadow:0 0 14px rgba(255,255,255,0.2); }
  .social-btn svg{ width:16px; height:16px; fill:currentColor; }

  /* ---------- WORK SECTION ---------- */
  .work-section{ width:100%; max-width:900px; text-align:center; }
  .work-title{
    font-size:clamp(28px, 4.5vw, 42px);
    margin-bottom:28px;
    letter-spacing:-0.045em;
  }
  .work-grid{
    display:grid; grid-template-columns:repeat(3, minmax(0, 220px));
    justify-content:center; gap:20px;
  }
  .site-copyright{
    margin-top:8px; color:var(--text); opacity:0.45;
    font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  }
  .video-frame{
    position:relative; width:100%; aspect-ratio:9/16;
    border:1px solid var(--line); border-radius:6px; overflow:hidden;
    background:var(--surface);
    transition:box-shadow .2s ease;
  }
  .video-frame:hover{ box-shadow:0 0 18px rgba(255,255,255,0.2); }
  .video-frame video{
    position:absolute; inset:0; width:100%; height:100%; border:0;
    object-fit:cover;
    filter:grayscale(1) brightness(0.42);
    transition:filter .2s ease;
  }
  .video-frame.is-playing video{ filter:none; }
  .video-play-btn{
    position:absolute; inset:0; z-index:1;
    display:flex; align-items:center; justify-content:center;
    border:0; background:transparent; color:var(--text); cursor:pointer;
    transition:background .2s ease, opacity .2s ease;
  }
  .video-play-btn::before{
    content:'▶'; display:grid; place-items:center;
    width:58px; height:58px; padding-left:4px;
    border:1px solid rgba(255,255,255,.85); border-radius:50%;
    background:rgba(0,0,0,.42); font-size:22px;
  }
  .video-frame.is-playing .video-play-btn{ opacity:0; pointer-events:none; }
  .video-frame:hover .video-play-btn{
    background:rgba(0,0,0,.12);
  }
  .video-views{
    position:absolute; top:10px; right:10px; z-index:2;
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 10px; border:1px solid rgba(255,255,255,.35);
    border-radius:20px; background:rgba(0,0,0,.62);
    color:var(--text); font-family:'DM Mono', monospace !important;
    font-size:11px; letter-spacing:.02em;
    animation:viewBadgeFloat 2.8s ease-in-out infinite;
  }
  .video-views svg{ width:14px; height:14px; fill:currentColor; }
  @keyframes viewBadgeFloat{
    0%, 100%{ transform:translateY(0); box-shadow:0 0 0 rgba(255,255,255,0); }
    50%{ transform:translateY(-3px); box-shadow:0 0 14px rgba(255,255,255,.25); }
  }
  @media (max-width:700px){
    .work-grid{ grid-template-columns:minmax(0, 280px); max-width:280px; margin:0 auto; }
  }

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.8);
    display:none; align-items:center; justify-content:center;
    padding:24px; z-index:100;
  }
  .overlay.show{ display:flex; }

  .modal{
    background:var(--surface); border:1px solid var(--line); border-radius:6px;
    width:100%; max-width:440px; padding:36px 30px;
    position:relative; text-align:center;
  }
  .modal-close{
    position:absolute; top:16px; right:20px;
    background:none; border:none; color:var(--text-dim);
    font-size:24px; cursor:pointer; line-height:1;
  }
  .modal-close:hover{ color:var(--text); }

  .modal-title{
    font-size:32px; letter-spacing:-0.04em; margin-bottom:20px;
  }
  .modal-content-box{
    display:flex; flex-direction:column; gap:14px;
    background:var(--bg); border:1px solid var(--line);
    padding:20px; border-radius:4px; margin-bottom:20px;
  }
  .contact-detail{
    font-size:15px; color:var(--text); line-height:1.4;
  }
  .contact-detail strong{
    color:var(--accent); text-decoration:underline;
  }
  .recommended-detail{
    font-size:13px; color:var(--text-dim); line-height:1.4;

  .modal-discord-btn{
    display:inline-block; width:100%;
    background:var(--accent); color:#0A0A0A;
    padding:14px; border-radius:2px; font-size:14px;
    transition:background .15s ease;
  }
  .modal-discord-btn:hover{ background:#D8D8D8; }

  @media (max-width:480px){
    .modal{ padding:28px 20px; }
  }
</style>

<script>

  // ---------- CROSSHAIR & CURSOR SCRIPT ----------
  const crosshair = document.querySelector('.crosshair');
  const smearCount = 7;
  const smears = Array.from({ length: smearCount }, () => {
    const smear = crosshair.cloneNode(true);
    smear.classList.remove('crosshair');
    smear.classList.add('crosshair-smear');
    smear.setAttribute('aria-hidden', 'true');
    document.body.appendChild(smear);
    return { element: smear, x: 0, y: 0, active: false };
  });
  let smearIndex = 0;
  let lastX = 0, lastY = 0, lastFrame = 0;
  let leftMouseDown = false;

  document.addEventListener('mousedown', (e) => { if (e.button === 0) leftMouseDown = true; });
  document.addEventListener('mouseup', (e) => { if (e.button === 0) leftMouseDown = false; });
  document.addEventListener('blur', () => { leftMouseDown = false; });

  document.addEventListener('mousemove', (e) => {
    const now = performance.now();
    const distance = Math.hypot(e.clientX - lastX, e.clientY - lastY);
    crosshair.style.left = e.clientX + 'px';
    crosshair.style.top = e.clientY + 'px';

    if (leftMouseDown && distance > 3 && now - lastFrame > 14) {
      const smear = smears[smearIndex];
      smearIndex = (smearIndex + 1) % smearCount;
      smear.element.style.left = e.clientX + 'px';
      smear.element.style.top = e.clientY + 'px';
      smear.element.style.opacity = '0.52';
      smear.element.style.transition = 'none';
      smear.element.style.transform = 'translate(-50%, -50%) scale(1)';
      requestAnimationFrame(() => {
        smear.element.style.transition = 'opacity 150ms ease-out, transform 150ms ease-out';
        smear.element.style.opacity = '0';
        smear.element.style.transform = 'translate(-50%, -50%) scale(0.82)';
      });
      lastFrame = now;
    }
    lastX = e.clientX;
    lastY = e.clientY;
  });

  // ---------- SNOW EFFECT ----------
  const snowContainer = document.getElementById('snow');
  const flakeCount = 60;
  for(let i = 0; i < flakeCount; i++){
    const flake = document.createElement('div');
    flake.className = 'snowflake';
    const size = Math.random() * 3 + 2;
    flake.style.width = size + 'px';
    flake.style.height = size + 'px';
    flake.style.left = Math.random() * 100 + 'vw';
    const fallDuration = Math.random() * 8 + 6;
    const swayDuration = Math.random() * 3 + 2;
    flake.style.animationDuration = fallDuration + 's, ' + swayDuration + 's';
    flake.style.animationDelay = (Math.random() * fallDuration) + 's, 0s';
    flake.style.opacity = Math.random() * 0.5 + 0.4;
    snowContainer.appendChild(flake);
  }

  // ---------- LOGO TYPING EFFECT ----------
  const logoText = document.getElementById('logoText');
  const fullLogo = 'ciblo.xyz';
  let logoIdx = 0;
  let logoDeleting = false;

  function typeLogo(){
    if(!logoDeleting){
      logoIdx++;
      logoText.textContent = fullLogo.slice(0, logoIdx);
      if(logoIdx === fullLogo.length){
        logoDeleting = true;
        setTimeout(typeLogo, 1400);
        return;
      }
      setTimeout(typeLogo, 150);
    } else {
      logoIdx--;
      logoText.textContent = fullLogo.slice(0, logoIdx);
      if(logoIdx === 0){
        logoDeleting = false;
        setTimeout(typeLogo, 500);
        return;
      }
      setTimeout(typeLogo, 90);
    }
  }
  typeLogo();

  // ---------- MODAL OPEN/CLOSE ----------
  const openBtn = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const overlay = document.getElementById('overlay');

  openBtn.addEventListener('click', () => overlay.classList.add('show'));
  closeBtn.addEventListener('click', () => overlay.classList.remove('show'));
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) overlay.classList.remove('show');
  });

  // ---------- WORK VIDEOS ----------
  document.querySelectorAll('.video-frame').forEach((frame) => {
    const video = frame.querySelector('video');
    const playButton = frame.querySelector('.video-play-btn');
    const playVideo = () => {
      document.querySelectorAll('.video-frame video').forEach((otherVideo) => {
        if (otherVideo !== video) otherVideo.pause();
      });
      video.play();
    };
    playButton.addEventListener('click', playVideo);
    video.addEventListener('click', () => video.paused ? playVideo() : video.pause());
    video.addEventListener('play', () => frame.classList.add('is-playing'));
    video.addEventListener('pause', () => frame.classList.remove('is-playing'));
    video.addEventListener('ended', () => frame.classList.remove('is-playing'));
  });
</script>
